name: Daily Exchange Rate Fetch

# Runs automatically every day at 06:00 UTC, and can also be triggered
# manually from the Actions tab (useful for demoing the pipeline live).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest exchange rates
        run: python fetch_exchange_rates.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exchange_rate_history.csv
          git diff --staged --quiet || git commit -m "Automated: update exchange rate history"
          git push
